<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>SARO Lab — Open source</title>
  <!-- 소셜 카드. 잔별을 배경에 흩어 별하늘을 만들고, 마크와 워드마크는 왼쪽에
       모아 둔다. 텍스트가 실제 폰트라 resvg가 시스템 폰트를 로드해야 한다. -->
  <defs>
    <radialGradient id="w1"><stop offset="0" stop-color="#7c68d8" stop-opacity="0.30"/><stop offset="1" stop-color="#7c68d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.22"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="w3"><stop offset="0" stop-color="#c9bdf9" stop-opacity="0.14"/><stop offset="1" stop-color="#c9bdf9" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0a14"/>
  <circle cx="180" cy="110" r="440" fill="url(#w1)"/>
  <circle cx="1080" cy="560" r="440" fill="url(#w2)"/>
  <circle cx="860" cy="80" r="360" fill="url(#w3)"/>

  <!-- 배경 잔별 -->
  <g fill="#ffffff">
    <circle cx="962" cy="118" r="2.6" opacity="0.55"/>
    <circle cx="1035" cy="232" r="1.8" opacity="0.4"/>
    <circle cx="884" cy="316" r="2.2" opacity="0.32"/>
    <circle cx="1108" cy="150" r="1.6" opacity="0.45"/>
    <circle cx="806" cy="196" r="1.6" opacity="0.28"/>
    <circle cx="1006" cy="430" r="2.2" opacity="0.3"/>
    <circle cx="742" cy="470" r="1.7" opacity="0.26"/>
    <circle cx="1142" cy="382" r="2" opacity="0.34"/>
    <circle cx="112" cy="470" r="1.9" opacity="0.3"/>
    <circle cx="236" cy="556" r="1.6" opacity="0.24"/>
  </g>

  <!-- 마크 : 32 그리드를 5.6배 -->
  <g transform="translate(88 176) scale(5.6)">
    <path fill="#b3a4f5" d="M13 5C14.28 10.44 15.56 11.72 21 13C15.56 14.28 14.28 15.56 13 21C11.72 15.56 10.44 14.28 5 13C10.44 11.72 11.72 10.44 13 5Z"/>
    <path fill="#ded6ff" d="M24 4C24.64 6.72 25.28 7.36 28 8C25.28 8.64 24.64 9.28 24 12C23.36 9.28 22.72 8.64 20 8C22.72 7.36 23.36 6.72 24 4Z"/>
    <path fill="#8f7ce6" d="M23 17.5C23.88 21.24 24.76 22.12 28.5 23C24.76 23.88 23.88 24.76 23 28.5C22.12 24.76 21.24 23.88 17.5 23C21.24 22.12 22.12 21.24 23 17.5Z"/>
  </g>

  <text x="292" y="286" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#ffffff">SARO Lab</text>
  <rect x="294" y="322" width="112" height="5" rx="2.5" fill="#a99af0"/>
  <text x="292" y="392" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" fill="#ddd8f2">An Open Source Project Space for Developers</text>
  <text x="292" y="440" font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" fill="#9a94b8">From security systems to web tools—feel free to join and explore.</text>
</svg>
